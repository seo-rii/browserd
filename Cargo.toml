[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "macros", "ws"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1.3"
http-body-util = "0.1"
ipnet = { version = "2.11", features = ["serde"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
lru = "0.16"
nix = { version = "0.30", features = ["fs", "mount", "process", "resource", "sched", "signal", "socket", "user"] }
parking_lot = "0.12"
prometheus-client = "0.25"
rand = "0.9"
redis = { version = "1.6", default-features = false, features = ["connection-manager", "tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "migrate", "postgres", "runtime-tokio", "uuid"] }
subtle = "2.6"
tempfile = "3.20"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "5.5", features = ["chrono", "uuid", "url"] }
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
zeroize = { version = "1.8", features = ["derive"] }

# Test-only dependencies are centralized so every crate uses one audited version.
insta = { version = "1.43", features = ["json"] }
loom = "0.7"
proptest = "1.7"
rstest = "0.26"
serial_test = "3.2"
wiremock = "0.6"
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
